<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación de Arrays y Objetos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #ecf0f1;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .result {
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>Manipulación de Arrays y Estructuras de Objetos</h1>
    <h2>Para Ver en consola presionar F12</h2>
    <div class="container">
        <h2>Ejercicio 1: Alumnos Aprobados</h2>
        <p>A continuación se muestran los alumnos que han aprobado (nota mayor o igual a 7):</p>
        <ul id="lista-aprobados"></ul>
    </div>

    <div class="container">
        <h2>Ejercicio 2: Detalles del Producto</h2>
        <p>Información del producto desestructurada:</p>
        <div id="detalle-producto"></div>
    </div>

    <!-- Vinculación del script externo -->
    <script src="act.js"></script>
</body>
</html>
