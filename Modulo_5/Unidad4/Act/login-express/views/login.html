<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | UTN</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <main class="panel">
        <div class="brand">React / Node.js</div>
        <h1>Iniciar sesión</h1>
        <p>Ingresá tus credenciales para acceder al sistema.</p>
        <form action="/login" method="POST"><label for="email">Correo electrónico</label><input id="email" name="email"
                type="email" autocomplete="username" required placeholder="admin@utn.com"><label
                for="password">Contraseña</label><input id="password" name="password" type="password"
                autocomplete="current-password" required placeholder="••••••••"><button type="submit">Ingresar</button>
        </form><small>Actividad educativa: Express + MySQL + sesiones.</small>
    </main>
</body>

</html>
