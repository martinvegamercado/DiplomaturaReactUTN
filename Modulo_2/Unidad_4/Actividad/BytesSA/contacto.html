<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Bytes</title>
    <!-- Normalize.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="bytes.css">
</head>
<body>
    <header>
        <div class="logo">Bytes</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="page-content">
        <section class="contact">
            <h1>Contáctanos</h1>
            <p class="subtitle">¿Tienes un proyecto en mente? Hablemos.</p>
            
            <div class="contact-container">
                <form action="#" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <input type="text" id="name" name="name" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <textarea id="message" name="message" rows="6" required placeholder="Cuéntanos sobre tu proyecto..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-full">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Bytes. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
